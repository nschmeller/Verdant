name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint
    # macos-26 ships Xcode 26.6 (17F113) as its default, which carries the iOS 26 SDK that
    # FoundationModels lives in. macos-15 does NOT: its default is Xcode 16.4 / iOS 18.5.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Assert the toolchain instead of assuming it, and fail HERE if it is wrong. This step used to
      # run `xcode-select -switch /Applications/Xcode_26.app || echo "not present"`. That path never
      # exists on any runner image — they install versioned paths like /Applications/Xcode_26.6.app —
      # so the `||` swallowed the error, the job silently fell back to Xcode 16.4, and it died three
      # minutes later inside the compiler with a baffling "No such module 'FoundationModels'".
      - name: Verify toolchain has the iOS 26 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS Simulator SDK: $sdk"
          case "$sdk" in
            26.*) ;;
            *) echo "::error::FoundationModels needs the iOS 26 SDK; this toolchain has $sdk"; exit 1 ;;
          esac
          fw="$(xcrun --sdk iphonesimulator --show-sdk-path)/System/Library/Frameworks/FoundationModels.framework"
          test -d "$fw" || { echo "::error::FoundationModels.framework missing from the iOS SDK"; exit 1; }

      # SwiftFormat and SwiftLint are pinned to exact releases; `brew install` tracks latest, and a
      # formatter that enables a rule by default turns CI red on code nobody touched. That is not
      # hypothetical: 0.62 enabled wrapIfStatementBodies and failed 46 untouched files here. Bump
      # these deliberately, in a commit that also carries whatever reformatting the new version wants.
      - name: Install tools
        env:
          SWIFTFORMAT_VERSION: "0.62.1"
          SWIFTLINT_VERSION: "0.65.0"
        run: |
          set -euo pipefail
          brew install xcodegen xcbeautify
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -qjo "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$RUNNER_TEMP/tools"
          unzip -qjo "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/tools"
          chmod +x "$RUNNER_TEMP/tools/swiftformat" "$RUNNER_TEMP/tools/swiftlint"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Verify pinned tool versions
        run: |
          swiftformat --version
          swiftlint --version

      - name: Generate project
        run: xcodegen generate

      - name: Lint & format check
        run: |
          swiftlint lint --strict
          # Paths must precede `--lint`: it is a flag, and SwiftFormat parses a following
          # path as its value, failing with "--lint argument does not expect a value".
          swiftformat Verdant VerdantTests --lint

      # Resolve a real device instead of pinning a name: a runner image can ship a different device
      # set from the one a name was written against, and a name that no longer resolves fails the job
      # before a single test runs. Any booted-capable iPhone runs this suite identically.
      #
      # This comment used to add that `iPhone 16 Pro` "already fails locally, where the iOS 26 runtime
      # offers the iPhone 17 family and no 16 Pro at all". That is wrong, and it was checked on
      # 2026-08-02 rather than reasoned about: `simctl list devices available` does show only the 17
      # family, but the 16 Pro DEVICE TYPE is installed, and Xcode instantiates a simulator from a type
      # plus an available runtime on demand — the README's pinned command runs the full suite fine.
      # The claim had already propagated into notes elsewhere as a reason to "fix" that working
      # command. Dynamic resolution is still right here; the reason given for it was not.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys;
          d=json.load(sys.stdin)["devices"]
          rs=sorted([r for r in d if "iOS" in r], reverse=True)
          for r in rs:
              for dev in d[r]:
                  if dev.get("isAvailable") and "iPhone" in dev["name"]:
                      print(dev["udid"]); raise SystemExit
          raise SystemExit("no available iPhone simulator")')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$udid"
          # Boot it HERE and block until boot completes. `xcodebuild test` will happily start
          # installing onto a device that is still coming up, and then fails the whole run with
          # FBSOpenApplicationErrorDomain 6 — "Application failed preflight checks (Busy)". That is
          # a launch race, not a test failure, and it reproduces regularly on a loaded machine, so
          # without this the suite goes intermittently red for reasons unrelated to the code.
          xcrun simctl boot "$udid" || true   # already-booted is not an error
          xcrun simctl bootstatus "$udid" -b

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Verdant.xcodeproj \
            -scheme Verdant \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
